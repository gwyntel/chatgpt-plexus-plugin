name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/test-worker.mjs
      - run: bash scripts/build.sh
      - run: node scripts/validate-artifact.mjs
